<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1215" media="(prefers-color-scheme: dark)" />
    <title>Kaname 要 · Where should we meet?</title>
    <meta name="description" content="Find the closest station for all your friends in Tokyo. Add everyone's station, and Kaname finds the one with the shortest train trips for all." />
    <style>
      /* The loading screen shows before the app's code arrives. The colors repeat theme.css. */
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px;
        background: #f2f3f0; color: #5c6168; font: 400 14px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; text-align: center; }
      .boot-seal { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 5px; transform: rotate(-4deg);
        background: #c8361d; color: #ffffff; font: 700 26px "BIZ UDPGothic", "Hiragino Sans", system-ui, sans-serif; }
      .boot-name { margin: 0; color: #17191c; font-size: 18px; font-weight: 700; }
      .boot-msg { margin: 0; }
      @media (prefers-color-scheme: dark) {
        .boot { background: #0f1215; color: #9aa3a0; }
        .boot-seal { background: #ff6b4f; color: #0f1215; }
        .boot-name { color: #eef0ec; }
      }
      .boot { z-index: 10; }

      /*
       The train, for slow loads only: the scene fades in after 0.6 s, so a fast load never shows it.
       Each 7 s, four toy-proportioned cars (348 px) run in, brake until the front stops at the platform end,
       wait with the doors open, then pull away. The cars rock on their springs, one after another.
      */
      .boot-rail { --k-body: #fbfbf8; --k-ink: #17191c; --k-roof: #d5d8d0; --k-band: #c8361d; --k-win: #2a3a52; --k-door: #e6e8e2;
        --k-hub: #9ea29b; --k-deck: #c9ccc4; --k-rail: #9ea29b; --k-sign: #ffffff;
        position: relative; width: min(390px, 100vw); height: 112px; margin-top: 28px; overflow: hidden; opacity: 0;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 20px, #000 calc(100% - 20px), transparent);
        mask-image: linear-gradient(90deg, transparent, #000 20px, #000 calc(100% - 20px), transparent);
        animation: boot-in 300ms 600ms ease-out forwards; }
      @media (prefers-color-scheme: dark) {
        .boot-rail { --k-body: #262c31; --k-ink: #eef0ec; --k-roof: #3a4148; --k-band: #ff6b4f; --k-win: #11161a; --k-door: #2f363c;
          --k-hub: #59616a; --k-deck: #2a3036; --k-rail: #59616a; --k-sign: #1d2227; }
      }
      .boot-post { position: absolute; left: 318px; top: 0; width: 4px; height: 86px; background: var(--k-rail); }
      .boot-sign { position: absolute; left: 288px; top: 2px; width: 64px; padding: 3px 0 4px; background: var(--k-sign); border: 1.5px solid var(--k-ink);
        border-radius: 4px; color: var(--k-ink); font-size: 8px; line-height: 1.2; letter-spacing: 0.06em; }
      .boot-sign b { display: block; font: 700 15px "BIZ UDPGothic", "Hiragino Sans", system-ui, sans-serif; letter-spacing: 0; }
      .boot-sign i { display: block; height: 3px; margin: 2px 0 1px; background: var(--k-band); }
      .boot-deck { position: absolute; left: 0; width: 372px; top: 86px; height: 14px; background: var(--k-deck); border-top: 3px solid #e2b93b; }
      .boot-track { position: absolute; left: 0; right: 0; top: 101px; height: 8px;
        background: linear-gradient(var(--k-rail), var(--k-rail)) 0 1px / 100% 2px no-repeat, linear-gradient(var(--k-rail), var(--k-rail)) 0 6px / 100% 2px no-repeat,
          repeating-linear-gradient(90deg, var(--k-deck) 0 4px, transparent 4px 14px); }
      .boot-train { position: absolute; left: 0; top: 63px; display: flex; gap: 4px; animation: boot-move 7s 600ms infinite backwards; }
      .boot-car { width: 84px; height: 40px; overflow: visible; transform-origin: 50% 88%; animation: boot-rock 7s 600ms infinite linear backwards; }
      .boot-car:nth-child(1) { animation-delay: 810ms; }
      .boot-car:nth-child(2) { animation-delay: 740ms; }
      .boot-car:nth-child(3) { animation-delay: 670ms; }
      .boot-car .b { fill: var(--k-body); stroke: var(--k-ink); stroke-width: 1.6; }
      .boot-car .r { fill: var(--k-roof); }
      .boot-car .s { fill: var(--k-band); }
      .boot-car .w { fill: var(--k-win); }
      .boot-car .d { fill: var(--k-door); stroke: var(--k-ink); stroke-width: 0.9; }
      .boot-car .o { fill: #f2c94c; opacity: 0; animation: boot-doors 7s 600ms infinite linear backwards; }
      .boot-car .p { fill: none; stroke: var(--k-ink); stroke-width: 1.1; }
      .boot-car .k { fill: var(--k-ink); }
      .boot-car .h { fill: var(--k-hub); }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-move {
        0%   { transform: translateX(-370px); animation-timing-function: cubic-bezier(0.18, 0.64, 0.34, 1); }
        38%  { transform: translateX(14px); }
        62%  { transform: translateX(14px); animation-timing-function: cubic-bezier(0.62, 0, 0.94, 0.52); }
        100% { transform: translateX(410px); }
      }
      @keyframes boot-rock {
        0%, 24% { transform: translateY(0) rotate(0deg); }
        32%  { transform: translateY(0.4px) rotate(0.9deg); }
        38%  { transform: translateY(1px) rotate(1.8deg); }
        41%  { transform: translateY(-1.6px) rotate(-0.9deg); }
        44%  { transform: translateY(0.4px) rotate(0.35deg); }
        47%, 62% { transform: translateY(0) rotate(0deg); }
        67%  { transform: translateY(0.6px) rotate(-1.2deg); }
        82%  { transform: translateY(0.2px) rotate(-0.5deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }
      @keyframes boot-doors { 0%, 41% { opacity: 0; } 44%, 57% { opacity: 1; } 60%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-rail { animation: none; opacity: 1; }
        .boot-train { animation: none; transform: translateX(14px); }
        .boot-car, .boot-car .o { animation: none; }
      }
    </style>
