[project]
name = "kaname-pipeline"
version = "0.1.0"
description = "Builds the kaname station travel-time matrices from Mini Tokyo 3D timetables"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kaname-pipeline = "kaname_pipeline.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaname_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["kaname_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
