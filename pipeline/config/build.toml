# kaname pipeline build configuration. Every value here changes the shipped matrices,
# so a change needs a line in DECISIONS.md.

[source]
mt3d_repo = "https://github.com/nagix/mini-tokyo-3d.git"
# 2026-11-02 "Update station exit poi data" (the commit the M0 spike used)
mt3d_commit = "fa7833f18a288aeca171b68892bb7f67e229e4ca"
calendar = "Weekday"

[area]
# Tokyo Station, as Mini Tokyo 3D places it (lon, lat)
center = [139.76704, 35.6813]
input_radius_km = 60.0
candidate_radius_km = 30.0
candidate_min_lines = 2

[complex]
# Stops with the same normalized Japanese name within this distance form one station complex.
merge_radius_m = 550.0

[transfer]
same_stop_min = 1
same_subgroup_min = 3
cross_subgroup_base_min = 3
cross_subgroup_min = 5
walk_m_per_min = 80.0
detour = 1.3
same_name_link_m = 600.0

[windows]
# Representative weekday windows. Minutes are the median planner-style duration
# (first boarding to arrival) over a departure at every minute of the window.
outbound = ["17:30", "19:30"]
home = ["21:00", "23:00"]
horizon_min = 240
